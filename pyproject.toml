[project]
name = "homeostatic-trust-model"
version = "0.1.0"
description = "Homeostatic Trust Model (HTM) for detecting multi-turn jailbreaks in LLM conversations"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = [
    "pyyaml",
    "requests",
    "datasets",
    "tqdm",
    "torch",
    "matplotlib",
]

[project.optional-dependencies]
gepa = ["dspy>=2.6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data_gen*", "signal_layer*", "htm*", "eval*"]